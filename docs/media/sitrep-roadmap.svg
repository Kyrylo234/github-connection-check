<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
  <title id="title">SitRep development roadmap</title>
  <desc id="desc">Four phases: Live News Globe is live, Scenario Lab is in development, Historical Archive is planned, and Historical Command is a future vision.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9dad95" stroke-opacity=".055" stroke-width="1"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b16"/><stop offset="1" stop-color="#18251d"/></linearGradient>
    <linearGradient id="active" x2="1"><stop stop-color="#a7d2ac"/><stop offset="1" stop-color="#5d9877"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1400" height="690" rx="18" fill="url(#bg)"/>
  <rect width="1400" height="690" rx="18" fill="url(#grid)"/>
  <path d="M28 75V27H76 M1324 27H1372V75 M28 615V663H76 M1324 663H1372V615" stroke="#a6c4a6" stroke-opacity=".4" stroke-width="2" fill="none"/>
  <text x="75" y="99" fill="#dce5d4" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="800" letter-spacing="-1">SITREP</text>
  <text x="77" y="131" fill="#8eab92" font-family="monospace" font-size="15" letter-spacing="3">DEVELOPMENT ROADMAP // GLOBAL INTELLIGENCE SYSTEM</text>
  <g font-family="monospace" font-size="14" text-anchor="end" fill="#a6b5a2"><text x="1325" y="89">PROJECT STATUS</text><text x="1325" y="114" fill="#b8dbc0">ACTIVE DEVELOPMENT  ●</text></g>
  <path d="M82 165H1318" stroke="#6d8870" stroke-opacity=".55"/>
  <!-- connected progression line -->
  <path d="M185 243H1215" fill="none" stroke="#294235" stroke-width="8" stroke-linecap="round"/>
  <path d="M185 243H530" fill="none" stroke="url(#active)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="monospace" font-size="13" letter-spacing="1">
    <text x="185" y="210" fill="#c1dfc2" text-anchor="middle">01 / NOW</text>
    <text x="528" y="210" fill="#e4c18c" text-anchor="middle">02 / BUILDING</text>
    <text x="872" y="210" fill="#a6b7a5" text-anchor="middle">03 / PLANNED</text>
    <text x="1215" y="210" fill="#a6b7a5" text-anchor="middle">04 / FUTURE</text>
  </g>
  <g>
    <circle cx="185" cy="243" r="16" fill="#a4d1ae" stroke="#d6eed9" stroke-width="2"/>
    <path d="m178 243 5 5 10-11" fill="none" stroke="#13241a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="528" cy="243" r="15" fill="#e3bd80" stroke="#f4d8a8" stroke-width="2"/>
    <circle cx="528" cy="243" r="6" fill="#283322"/>
    <circle cx="872" cy="243" r="13" fill="#15251b" stroke="#a8b9a9" stroke-width="3"/>
    <circle cx="1215" cy="243" r="13" fill="#15251b" stroke="#a8b9a9" stroke-width="3"/>
  </g>
  <!-- Card 1 -->
  <g transform="translate(54 292)">
    <rect width="306" height="268" rx="12" fill="#203327" stroke="#6aa180" stroke-width="1.6"/>
    <rect x="17" y="17" width="92" height="27" rx="4" fill="#365a40"/>
    <text x="63" y="35" fill="#d8edda" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">● LIVE</text>
    <g transform="translate(247 29)" stroke="#b8d8b9" fill="none" stroke-width="2"><circle r="21"/><ellipse rx="9" ry="21"/><path d="M-21 0H21M-17-11H17M-17 11H17"/></g>
    <text x="20" y="90" fill="#e3eadd" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">News Globe</text>
    <text x="20" y="121" fill="#a9bca9" font-family="monospace" font-size="14">Explore global headlines</text>
    <path d="M20 146H286" stroke="#68836d" stroke-opacity=".5"/>
    <text x="20" y="174" fill="#d1dacd" font-family="monospace" font-size="14">+ Mapped news markers</text>
    <text x="20" y="199" fill="#d1dacd" font-family="monospace" font-size="14">+ Credible source links</text>
    <text x="20" y="224" fill="#d1dacd" font-family="monospace" font-size="14">+ AI-assisted analysis</text>
    <text x="20" y="249" fill="#8ebaa0" font-family="monospace" font-size="12">CURRENT FOUNDATION</text>
  </g>
  <!-- Card 2 -->
  <g transform="translate(382 292)">
    <rect width="306" height="268" rx="12" fill="#292d25" stroke="#a78b61" stroke-width="1.6"/>
    <rect x="17" y="17" width="129" height="27" rx="4" fill="#554a32"/>
    <text x="81" y="35" fill="#f4d8a8" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">◌ IN PROGRESS</text>
    <g transform="translate(251 30)" stroke="#ead0a4" stroke-width="2.3" fill="none"><path d="M-18-13H18V13H-18Z"/><path d="m-7-4 6 6 11-12"/></g>
    <text x="20" y="90" fill="#eee7da" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Scenario Lab</text>
    <text x="20" y="121" fill="#bcb5a4" font-family="monospace" font-size="14">Decide under pressure</text>
    <path d="M20 146H286" stroke="#91816b" stroke-opacity=".5"/>
    <text x="20" y="174" fill="#d8d5ca" font-family="monospace" font-size="14">+ Interactive scenarios</text>
    <text x="20" y="199" fill="#d8d5ca" font-family="monospace" font-size="14">+ Branching choices</text>
    <text x="20" y="224" fill="#d8d5ca" font-family="monospace" font-size="14">+ Decision feedback</text>
    <text x="20" y="249" fill="#d6b585" font-family="monospace" font-size="12">NEXT MILESTONE</text>
  </g>
  <!-- Card 3 -->
  <g transform="translate(710 292)">
    <rect width="306" height="268" rx="12" fill="#1c2b23" stroke="#4f6755" stroke-width="1.6"/>
    <rect x="17" y="17" width="100" height="27" rx="4" fill="#34473a"/>
    <text x="67" y="35" fill="#b5c9b7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">○ PLANNED</text>
    <g transform="translate(252 30)" stroke="#abc0ae" stroke-width="2" fill="none"><rect x="-20" y="-18" width="40" height="36" rx="3"/><path d="M-20-7H20M-11-24V-11M11-24V-11M-10 1H-3M3 1H10M-10 9H-3"/></g>
    <text x="20" y="90" fill="#e3eadd" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Historical Archive</text>
    <text x="20" y="121" fill="#a9bca9" font-family="monospace" font-size="14">Explore news through time</text>
    <path d="M20 146H286" stroke="#68836d" stroke-opacity=".5"/>
    <text x="20" y="174" fill="#d1dacd" font-family="monospace" font-size="14">+ Date-based globe</text>
    <text x="20" y="199" fill="#d1dacd" font-family="monospace" font-size="14">+ Historical sources</text>
    <text x="20" y="224" fill="#d1dacd" font-family="monospace" font-size="14">+ Cold War timelines</text>
    <text x="20" y="249" fill="#879d8d" font-family="monospace" font-size="12">TIME TRAVEL</text>
  </g>
  <!-- Card 4 -->
  <g transform="translate(1038 292)">
    <rect width="306" height="268" rx="12" fill="#1c2b23" stroke="#4f6755" stroke-width="1.6"/>
    <rect x="17" y="17" width="108" height="27" rx="4" fill="#34473a"/>
    <text x="71" y="35" fill="#b5c9b7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">◇ CONCEPT</text>
    <g transform="translate(251 28)" stroke="#abc0ae" stroke-width="2" fill="none"><path d="m0-22 19 8v13c0 14-9 23-19 28-10-5-19-14-19-28v-13Z"/><path d="m-9 1 7 7 13-14"/></g>
    <text x="20" y="90" fill="#e3eadd" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Historical Command</text>
    <text x="20" y="121" fill="#a9bca9" font-family="monospace" font-size="14">Rewrite the outcome</text>
    <path d="M20 146H286" stroke="#68836d" stroke-opacity=".5"/>
    <text x="20" y="174" fill="#d1dacd" font-family="monospace" font-size="14">+ Lead a nation</text>
    <text x="20" y="199" fill="#d1dacd" font-family="monospace" font-size="14">+ Gemini story events</text>
    <text x="20" y="224" fill="#d1dacd" font-family="monospace" font-size="14">+ Alternate outcomes</text>
    <text x="20" y="249" fill="#879d8d" font-family="monospace" font-size="12">LONG-TERM VISION</text>
  </g>
  <path d="M82 597H1318" stroke="#6d8870" stroke-opacity=".5"/>
  <text x="82" y="633" fill="#a9bda9" font-family="monospace" font-size="14" letter-spacing="1">TRACK THE WORLD  /  EXPLORE THE PAST  /  CHANGE THE STORY</text>
  <text x="1318" y="633" fill="#7c987f" font-family="monospace" font-size="13" text-anchor="end">SITREP // ROADMAP</text>
</svg>
